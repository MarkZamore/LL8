#Survival-Expansion
[10-survival]
	#Dryable Bricks
	#Disable DryingBricks decrease stage when wet
	dryable_bricks_decrease_stage_when_wet = false
	#Drying Racks
	#Disable Drying Racks reduce the efficiency to prevent to dry at same speed one entire stack as a single item
	disable_drying_rack_nerfer = false
	#Drying Racks Speed reducer to balance Stack Nerfer
	#Example : 64 items 
	# 1x -> 64x time required 
	# 4x -> 64x/4 -> 16x time required 
	# 0.5x -> 64x/0.5 -> 128x time required 
	# Default: 1.0
	# Range: 0.001 ~ 2.147483647E9
	drying_rack_nerfer_decreaser = 1.0
	#Foundry
	#Disable Foundry speed boost based on fluid amount
	disable_foundry_speed_boost = false
	#Foundry Speed increaser based on fluid amount
	# Default: 0.25
	# Range: 0.001 ~ 2.147483647E9
	foundry_speed_increaser = 0.25

