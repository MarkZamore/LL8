#Agriculture
[1-agriculture]
	#Disable Toggleable Item-Use recipes
	optional_item_use_recipe = false
	#Disable player right-click on crops to collect
	#If detected farmersdelight it will turn off by default
	harvestable_action = true

#Automation
[2-automation]
	#Harvester
	#Base tick rate of Harvester to check AOE blocks when actived
	# Default: 5
	# Range: > 1
	harvester_tickrate = 5
	#FE consumed every tick
	# Default: 25
	# Range: > 1
	harvester_fe_rate = 25
	#FE Capacity
	# Default: 10000
	# Range: > 1
	harvester_fe_max = 10000
	#Max number of harvestable blocks harvestable foreach interaction
	# Default: 2048
	# Range: > 1
	harvester_limit = 2048
	#Disable any crop-plant replantable harvest
	harvester_disable_replant = false
	#Disable any plant like melons and pumpkins harvest
	harvester_disable_noreplant = false
	#Disable any tree harvest
	harvester_disable_tree = false
	#Disable any cactus/bamboo/sugar canes like harvest
	harvester_disable_bigplant = false
	#Disable any HarvestableAPI plant harvest
	harvester_disable_api = false
	#Disable drop items when output full
	harvester_disable_drop_when_full = false
	#Tree_chopper
	#Slot limit of upgrades applicable to the Chopper
	# Default: 15
	# Range: 1 ~ 64
	chopper_upgrade_slot_limit = 15
	#Tick delay on AOE checking the next blockpos
	# Default: 20
	# Range: > 1
	chopper_tick_rate = 20
	#FE usage every tick when upgraded
	# Default: 25
	# Range: > 1
	chopper_fe_rate = 25
	#Ticks added when consume FE
	# Default: 5
	# Range: > 1
	chopper_progress_fe = 5
	#Solar_panel
	#FE production every tick
	# Default: 16
	# Range: > 1
	solar_panel_fe_gen = 16
	#FE Capacity
	# Default: 10000
	# Range: > 1
	solar_panel_fe_max = 10000
	#Disable condition to see the sky
	solar_panel_disable_seesky = false
	#Disable condition to be daytime
	solar_panel_disable_daytime = false
	#Sprinkler
	#FE consumed every tick
	# Default: 25
	# Range: > 1
	sprinkler_fe_cost = 25
	#FE Capacity
	# Default: 10000
	# Range: > 1
	sprinkler_fe_max = 10000
	#Cobblestone_generator
	#Ticks delay to produce a resource
	# Default: 20
	# Range: > 1
	simple_cobblegen_tick_rate = 20
	#Item count every time executed
	# Default: 4
	# Range: > 1
	simple_cobblegen_item_count = 4
	#Ticks delay to produce a resource
	# Default: 5
	# Range: > 1
	advanced_cobblegen_tick_rate = 5
	#Item count every time executed
	# Default: 16
	# Range: > 1
	advanced_cobblegen_item_count = 16
	#Ticks delay to produce a resource
	# Default: 1
	# Range: > 1
	elite_cobblegen_tick_rate = 1
	#Item count every time executed
	# Default: 64
	# Range: > 1
	elite_cobblegen_item_count = 64
	#Water_collector
	#Ticks delay to produce a resource
	# Default: 20
	# Range: > 1
	simple_watergen_tick_rate = 20
	#Fluid amount every time executed
	# Default: 200
	# Range: > 1
	simple_watergen_fluid_amount = 200
	#Ticks delay to produce a resource
	# Default: 5
	# Range: > 1
	advanced_watergen_tick_rate = 5
	#Fluid amount every time executed
	# Default: 800
	# Range: > 1
	advanced_watergen_fluid_amount = 800
	#Ticks delay to produce a resource
	# Default: 1
	# Range: > 1
	elite_watergen_tick_rate = 1
	#Fluid amount every time executed
	# Default: 3200
	# Range: > 1
	elite_watergen_fluid_amount = 3200
	#Fluid capacity
	# Default: 4000
	# Range: > 1
	simple_watergen_capacity = 4000
	#Fluid capacity
	# Default: 16000
	# Range: > 1
	advanced_watergen_capacity = 16000
	#Fluid capacity
	# Default: 64000
	# Range: > 1
	elite_watergen_capacity = 64000

#Industrial-Machines
[3-industrialmachines]
	#Base Machine and Upgrades
	#Allow to place any machine on the opposite side when pressed shift during the placement
	enable_shift_invert_facing = false
	#Base max energy stored
	# Default: 100000
	# Range: > 1
	base_machine_max_fe = 100000
	#Max Speed Increaser Upgrade Types usable foreach machine
	# Default: 4
	# Range: 0 ~ 16
	max_speed_upgrades = 4
	#Max Energy Efficiency Upgrade Types usable foreach machine
	# Default: 16
	# Range: 0 ~ 16
	max_energy_upgrades = 16
	#Max Secondary Output Increaser Upgrade Types usable foreach machine
	# Default: 4
	# Range: 0 ~ 16
	max_luck_upgrades = 4
	#Max Fluid Efficiency Upgrade Types usable foreach machine
	# Default: 4
	# Range: 0 ~ 16
	max_fluid_upgrades = 4
	#Minimal tick delay based on upgrade installed
	# Default: 1
	# Range: > 1
	min_tick_rate = 1
	#Minimal Energy cost based on upgrade installed
	# Default: 5
	# Range: > 1
	min_fe_cost = 5
	#Minimal Fluid cost based on upgrade installed
	# Default: 0
	# Range: > 1
	min_mb_cost = 1
	#Maximal Secondary Chance based on upgrade installed
	# Default: 100
	# Range: > 1
	max_luck = 100
	#Disable crash safer when an Industrial Machine is corrupted
	disable_ms_firewall = false
	#Electric_furnace
	#Disable Vanilla Recipes
	machine_furnace_disable_vanilla = false
	#Vanilla Recipe Base FE consumed every tick
	# Default: 500
	# Range: > 1
	machine_furnace_vanilla_fe_cost = 500
	#Disable Vanilla Recipe Tick Reducer
	machine_furnace_vanilla_disable_tick_reducer = false
	#Vanilla Recipe Mininal Tick Delay
	# Default: 100
	# Range: > 1
	machine_furnace_vanilla_min_tick_delay = 100
	#Vanilla Recipe Tick Delay reduction of total Tick Delay
	# Default: 50
	# Range: 0 ~ 100
	machine_furnace_vanilla_percentuage_tick_delay = 50

