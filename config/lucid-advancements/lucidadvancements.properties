# Lucid Advancements Configuration File
# Colors use ARGB Hexadecimal format (e.g., 0xAARRGGBB)

# GUI scale. 0 = Auto, 1-8 = Fixed Scale
customGuiScale=0
# Min virtual width for auto-scaling
scaleMinVirtualWidth=550.0
# Min virtual height for auto-scaling
scaleMinVirtualHeight=300.0
# Keep search query across menu reopens
keepSearchQuery=true
# Config watcher (Needs Restart)
useConfigWatcher=false

# --- HUD OVERLAY ---
# Background color for pinned boxes
overlayBgColor=0x880A0A0A
# Accent color for normal pinned advancements
overlayNormalAccent=0xFF00FFAA
# Accent color for challenge pinned advancements
overlayChallengeAccent=0xFFAA00FF
# Title color for normal advancements
overlayTitleColor=0xFFFFFFFF
# Title color for challenge advancements
overlayChallengeTitleColor=0xFFFF77FF
# Text color for remaining criteria
overlayCriterionTextColor=0xFFAAAAAA
# Text color for the hidden criteria counter
overlayHiddenCountTextColor=0xFF555555
# Icon for locked criteria
overlayIconLocked=🔒
# Width of pinned boxes
overlayBoxWidth=135
# Right screen margin for pinned boxes
overlayRightMargin=8
# Starting Y position for the first box
overlayStartY=55
# Vertical spacing between boxes
overlayBoxSpacing=5
# Bottom screen margin (stops rendering below this)
overlayBottomScreenMargin=35
# Base height for boxes without criteria
overlayBaseBoxHeight=24
# Line height for criteria text
overlayLineHeight=10
# Extra padding when criteria are shown
overlayOverflowLinePadding=2
# Max visible criteria per box
overlayMaxVisibleCriteria=3
# Width of the colored accent strip
overlayAccentWidth=2
# Icon X offset
overlayIconXOffset=6
# Icon Y offset
overlayIconYOffset=4
# Title X offset
overlayTitleXOffset=26
# Title Y offset
overlayTitleYOffset=5
# Padding subtracted from width to truncate titles
overlayTitleMaxWidthPadding=32
# Y offset for the first criteria line
overlayCriteriaStartYOffset=22
# Criteria X offset
overlayCriterionXOffset=8
# Padding subtracted from width to truncate criteria
overlayCriterionMaxWidthPadding=10

# --- LOCKED NORMAL ---
# Background gradient start
cardNormalBg1=0xAA1A1A1A
# Background gradient end
cardNormalBg2=0xAA121212
# Border color
cardNormalBorder=0x882A2A2A
# Title text color
cardNormalTitle=0xFFFFFFFF

# --- LOCKED CHALLENGE ---
# Border color
cardRareBorder=0xAA440077
# Title text color
cardRareTitle=0xFFCC77FF

# --- COMPLETED NORMAL ---
# Background gradient start
cardObtainedBg1=0xBB142E1F
# Background gradient end
cardObtainedBg2=0xBB0C1E14
# Border color
cardObtainedBorder=0xAA00FFAA
# Title text color
cardObtainedTitle=0xFF77FFAA

# --- COMPLETED CHALLENGE ---
# Background gradient start
cardObtainedRareBg1=0xBB2D1438
# Background gradient end
cardObtainedRareBg2=0xBB1E0C26
# Border color
cardObtainedRareBorder=0xAAAA00FF
# Title text color
cardObtainedRareTitle=0xFFFF77FF

# --- CARD COLORS ---
# Accent color for tracked cards
cardTrackedActiveColor=0xFF00FFAA
# Color for inactive icons and text
cardInactiveColor=0xFF555555
# Color for hidden advancement '?' marks
cardHiddenMarkColor=0xFF666666
# Description text color
cardDescriptionColor=0xFFAAAAAA
# Requirements label color
cardRequirementsLabelColor=0xFF888888
# Completed criteria text color
cardCriterionDoneColor=0xFF00CC88
# Pending criteria text color
cardCriterionPendingColor=0xFF777777
# Divider line color
cardDividerColor=0x44FFFFFF
# Hover overlay color
cardHoverOverlayColor=0x20FFFFFF
# Icon for locked criteria
cardIconLocked=🔒
# Icon for completed criteria/advancements
cardIconDone=✔
# Icon for the track toggle
cardIconTracked=✦
# Text replacing hidden titles/descriptions
cardHiddenLabel=???

# --- CARD LAYOUT ---
# Minimum card height
cardBaseHeightMin=46
# Vertical padding per description line
cardBaseHeightPadding=28
# Line height for description and criteria
cardLineHeight=10
# Extra height for expanded headers
cardExpandedHeaderHeight=20
# Padding around the criteria section
cardCriteriaSectionPadding=12
# Text X offset (title and description)
cardTextXOffset=40
# Item icon X offset
cardIconXOffset=12
# Track icon X offset (from right edge)
cardTrackIconXOffset=20
# Status icon X offset (from right edge)
cardStatusIconXOffset=30

# --- SCREEN LAYOUT ---
# Sidebar width
screenSidebarWidth=100
# Top bar height
screenTopBarHeight=48
# Sidebar row height
screenSidebarRowHeight=32
# Sidebar item highlight height
screenSidebarItemHeight=28
# Sidebar progress bar height
screenSidebarProgressHeight=38
# Top padding before the first sidebar row
screenSidebarTopPadding=12
# Margin around main content area
screenContentMargin=18
# Vertical spacing between cards
screenCardSpacing=8
# Bottom margin of the card viewport
screenViewportBottomMargin=18
# Content header height (including description)
screenHeaderHeight=52
# Minimum scroll thumb height
screenMinScrollThumbHeight=24
# Scrollbar width
screenScrollbarWidth=3
# Scrollbar right margin
screenScrollbarRightMargin=12

